[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# El plugin oficial traduce el output de Next (SSR, ISR, imágenes) a
# funciones de Netlify. Sin esto, el deploy sirve solo lo estático y el
# ISR de 60 s de F3 no funciona.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
