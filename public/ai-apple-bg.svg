<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffefdb" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffd9b3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffe8cc" stop-opacity="1"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />

  <g filter="url(#f1)" opacity="0.9">
    <ellipse cx="260" cy="200" rx="220" ry="150" fill="#ffb07a" opacity="0.85" />
    <ellipse cx="880" cy="180" rx="280" ry="190" fill="#ffdca6" opacity="0.7" />
    <ellipse cx="600" cy="520" rx="360" ry="240" fill="#ffb48a" opacity="0.65" />
  </g>

  <g opacity="0.9">
    <path d="M300 120 C 480 20, 720 40, 900 120 L 900 260 C 720 180, 480 160, 300 260 Z" fill="#ffb07a" opacity="0.12"/>
    <circle cx="960" cy="620" r="60" fill="#ff8a3d" opacity="0.08"/>
    <circle cx="140" cy="640" r="40" fill="#ff6a00" opacity="0.06"/>
  </g>

  <!-- geometric logo hint (transparent) -->
  <g transform="translate(50,50) scale(0.6)" opacity="0.04">
    <rect x="0" y="0" width="200" height="200" rx="36" fill="#ffffff" />
    <polygon points="100,20 160,70 130,150 70,150 40,70" fill="#ff8a3d" />
  </g>
</svg>