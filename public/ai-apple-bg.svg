<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0d10" stop-opacity="1"/>
      <stop offset="55%" stop-color="#10151b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#14181d" stop-opacity="1"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" />

  <g filter="url(#f1)" opacity="0.55">
    <ellipse cx="260" cy="180" rx="220" ry="150" fill="#3b82f6" opacity="0.28" />
    <ellipse cx="900" cy="160" rx="260" ry="180" fill="#60a5fa" opacity="0.16" />
    <ellipse cx="620" cy="560" rx="360" ry="220" fill="#1d4ed8" opacity="0.22" />
  </g>

  <g opacity="0.5">
    <path d="M300 120 C 480 30, 720 50, 900 120 L 900 250 C 720 170, 480 150, 300 250 Z" fill="#3b82f6" opacity="0.08"/>
    <circle cx="980" cy="620" r="60" fill="#60a5fa" opacity="0.06"/>
    <circle cx="130" cy="640" r="40" fill="#3b82f6" opacity="0.07"/>
  </g>

  <!-- fine dot grid for texture -->
  <g opacity="0.35">
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#dots)" />
  </g>
</svg>
